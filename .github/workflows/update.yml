name: update

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated] # sent by the portfolio after an /admin save or the daily sync

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate README and assets
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: a PAT with read:user to include private contribution counts in the direct-source fallback
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit only if something changed
        run: |
          if [ -n "$(git status --porcelain -- README.md assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets
            git commit -m "chore: refresh profile feed"
            git push
          else
            echo "No changes."
          fi
